name: Autonomous build
on:
  workflow_dispatch:
    inputs:
      runs_left:
        description: "Max chained runs remaining"
        default: "30"
concurrency:
  group: omega-build
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: State
        id: st
        run: |
          if head -1 PROGRESS.md | grep -q "ALL PHASES COMPLETE"; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.st.outputs.done == 'false'
        with:
          python-version: "3.11"
      - name: Claude builds
        if: steps.st.outputs.done == 'false'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 250
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,TodoWrite"
          prompt: |
            You are building OMEGA-IB unattended in GitHub Actions. Read CLAUDE.md (full spec) and PROGRESS.md (state).
            Continue from the first unfinished item and get through as much as you can this session.
            After each phase: tests green, update PROGRESS.md, git commit. Do NOT push. Never touch .github/.
            There is no IB Gateway here: build and test against the fake broker.
            Never loosen the safety rules in CLAUDE.md.
            When all 9 phases are done and tests pass, make the first line of PROGRESS.md exactly:
            ALL PHASES COMPLETE
            and commit.
      - name: Push work
        if: always() && steps.st.outputs.done == 'false'
        run: |
          git config user.name "omega-builder[bot]"
          git config user.email "omega-builder@users.noreply.github.com"
          git add -A
          git reset -q -- .github || true
          git diff --cached --quiet || git commit -qm "wip: builder checkpoint (run ${{ github.run_number }})"
          git push origin HEAD:main
      - name: Chain next run
        if: always() && steps.st.outputs.done == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tg(){ [ -n "$TG_TOKEN" ] && curl -s -m 10 "https://api.telegram.org/bot$TG_TOKEN/sendMessage" -d chat_id="$TG_CHAT" --data-urlencode text="🤖 OMEGA-IB: $1" >/dev/null; true; }
          if head -1 PROGRESS.md | grep -q "ALL PHASES COMPLETE"; then tg "✅ build complete. Run 'Deploy to Oracle VM' to ship."; exit 0; fi
          if [ "$(git rev-parse HEAD)" = "${{ steps.st.outputs.before }}" ]; then
            tg "⏸ run #${{ github.run_number }} made no progress — stopped. Check the Actions log, then re-run 'Autonomous build'."; exit 0; fi
          left=$(( ${{ inputs.runs_left || 30 }} - 1 ))
          if [ "$left" -le 0 ]; then tg "❌ run budget used up. Re-run 'Autonomous build' to continue."; exit 0; fi
          tg "run #${{ github.run_number }} → $(git log -1 --pretty=%s) ($left runs left)"
          gh workflow run build.yml -f runs_left=$left
